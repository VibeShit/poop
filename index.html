<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Archive — Museum Exhibition</title>
  <style>
    :root {
      --bg-wall: #0d0d0f;
      --bg-elevated: #16161a;
      --bg-placard: #141417;
      --text-primary: #f4f4f6;
      --text-secondary: #8e8e98;
      --text-muted: #55555e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.18);
      --spotlight: radial-gradient(ellipse 55% 48% at 50% 42%, rgba(255, 248, 235, 0.09) 0%, rgba(255, 248, 235, 0.02) 48%, transparent 75%);
      --frame-bg: #18181c;
      --frame-mat: #202026;
      --frame-shadow: 0 32px 70px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
      --accent: #e5c384;
      --ease-gallery: cubic-bezier(0.22, 1, 0.36, 1);
    }

    [data-theme="light"] {
      --bg-wall: #f3f1ed;
      --bg-elevated: #eae6df;
      --bg-placard: #faf9f6;
      --text-primary: #18181b;
      --text-secondary: #5c5c66;
      --text-muted: #9898a3;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.16);
      --spotlight: radial-gradient(ellipse 55% 48% at 50% 42%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.3) 50%, transparent 78%);
      --frame-bg: #ffffff;
      --frame-mat: #f7f6f2;
      --frame-shadow: 0 28px 60px -15px rgba(24, 24, 27, 0.16), 0 0 0 1px rgba(0, 0, 0, 0.07);
      --accent: #9a6b26;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-wall);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      transition: background-color 0.45s var(--ease-gallery), color 0.45s var(--ease-gallery);
      user-select: none;
    }

    .spotlight-layer {
      position: fixed;
      inset: 0;
      background: var(--spotlight);
      pointer-events: none;
      z-index: 0;
      transition: background 0.45s var(--ease-gallery);
    }

    /* Top Architectural Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.35rem 2.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .exhibition-brand {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .exhibition-kicker {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .exhibition-title {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .counter-pill {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      white-space: nowrap;
      color: var(--text-secondary);
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: var(--bg-placard);
    }

    .btn-ghost {
      background: var(--bg-placard);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.25s var(--ease-gallery);
    }

    .btn-ghost:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* Main Gallery Stage */
    main {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
      gap: 2.25rem;
    }

    .carousel-viewport {
      position: relative;
      width: 100%;
      max-width: 1120px;
      height: 360px;
      touch-action: pan-y;
      cursor: grab;
    }

    .carousel-viewport:active {
      cursor: grabbing;
    }

    #stageCards {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .exhibit-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 280px;
      height: 280px;
      background: var(--frame-bg);
      padding: 22px;
      border-radius: 4px;
      box-shadow: var(--frame-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        transform 0.6s var(--ease-gallery),
        opacity 0.6s var(--ease-gallery),
        filter 0.6s var(--ease-gallery),
        box-shadow 0.45s var(--ease-gallery);
      will-change: transform, opacity;
    }

    .exhibit-mat {
      width: 100%;
      height: 100%;
      background: var(--frame-mat);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .exhibit-mat::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, transparent 45%);
      pointer-events: none;
    }

    .exhibit-card img {
      width: 76%;
      height: 76%;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.4s var(--ease-gallery);
    }

    .exhibit-card[data-pos="center"] {
      transform: translate(-50%, -50%) scale(1.12);
      opacity: 1;
      z-index: 4;
      cursor: zoom-in;
    }

    .exhibit-card[data-pos="center"]:hover img {
      transform: scale(1.05);
    }

    .exhibit-card[data-pos="prev"] {
      transform: translate(calc(-50% - 340px), -50%) scale(0.82);
      opacity: 0.42;
      filter: blur(1px);
      z-index: 3;
      cursor: pointer;
    }

    .exhibit-card[data-pos="next"] {
      transform: translate(calc(-50% + 340px), -50%) scale(0.82);
      opacity: 0.42;
      filter: blur(1px);
      z-index: 3;
      cursor: pointer;
    }

    .exhibit-card[data-pos="prev"]:hover,
    .exhibit-card[data-pos="next"]:hover {
      opacity: 0.68;
      filter: blur(0);
    }

    .exhibit-card[data-pos="far-prev"] {
      transform: translate(calc(-50% - 600px), -50%) scale(0.65);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .exhibit-card[data-pos="far-next"] {
      transform: translate(calc(-50% + 600px), -50%) scale(0.65);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .exhibit-card[data-pos="hidden"] {
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    .missing-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      text-align: center;
      padding: 1rem;
    }

    /* Navigation Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--bg-placard);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s var(--ease-gallery);
    }

    .nav-arrow:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-50%) scale(1.06);
    }

    .nav-arrow.prev { left: 1.5rem; }
    .nav-arrow.next { right: 1.5rem; }

    /* Museum Wall Placard */
    .placard-wrapper {
      position: relative;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0 1.5rem;
    }

    .museum-placard {
      background: var(--bg-placard);
      border: 1px solid var(--border-subtle);
      padding: 1.1rem 1.75rem;
      border-radius: 2px;
      max-width: 460px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.25);
    }

    .placard-main {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .placard-cat {
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .placard-title {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 1.1rem;
      font-weight: 400;
    }

    .placard-file {
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .placard-meta {
      text-align: right;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Bottom Filmstrip Dock */
    footer {
      position: relative;
      z-index: 10;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-placard);
      padding: 0.85rem 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    .filmstrip {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      width: fit-content;
      max-width: 100%;
      overflow-x: auto;
      padding: 2px 2px 0.25rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .filmstrip::-webkit-scrollbar {
      height: 4px;
    }

    .filmstrip::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }

    .thumb-btn {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s var(--ease-gallery);
      padding: 4px;
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .thumb-btn span {
      font-family: ui-monospace, monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .thumb-btn:hover {
      border-color: var(--text-secondary);
      transform: translateY(-2px);
    }

    .thumb-btn.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
      transform: translateY(-2px);
    }

    /* Inspection Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(8, 8, 10, 0.94);
      backdrop-filter: blur(14px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-stage {
      width: min(75vw, 480px);
      height: min(75vw, 480px);
      background: #141418;
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lightbox-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .lightbox-stage.pixelated img {
      image-rendering: pixelated;
    }

    .lightbox-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #f4f4f6;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      header { padding: 1rem 1.25rem; }
      .exhibition-title { font-size: 0.98rem; }
      .carousel-viewport { height: 290px; }
      .exhibit-card { width: 220px; height: 220px; padding: 16px; }
      .exhibit-card[data-pos="prev"] { transform: translate(calc(-50% - 210px), -50%) scale(0.78); }
      .exhibit-card[data-pos="next"] { transform: translate(calc(-50% + 210px), -50%) scale(0.78); }
      .nav-arrow { width: 38px; height: 38px; }
      .nav-arrow.prev { left: 0.5rem; }
      .nav-arrow.next { right: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="spotlight-layer"></div>

  <header>
    <div class="exhibition-brand">
      <span class="exhibition-kicker">Permanent Collection</span>
      <h1 class="exhibition-title">Emoji Specimen Archive</h1>
    </div>
    <div class="header-controls">
      <span class="counter-pill" id="counterDisplay">01 / 32</span>
      <button class="btn-ghost" id="themeToggle" title="Toggle Gallery Lighting (T)">Daylight</button>
    </div>
  </header>

  <main>
    <div class="carousel-viewport" id="viewport">
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous Specimen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>

      <div id="stageCards"></div>

      <button class="nav-arrow next" id="nextBtn" aria-label="Next Specimen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <div class="placard-wrapper">
      <aside class="museum-placard" aria-live="polite">
        <div class="placard-main">
          <span class="placard-cat" id="placardCat">CATALOG NO. 01</span>
          <h2 class="placard-title" id="placardTitle">Specimen 01</h2>
          <span class="placard-file" id="placardFile">assets/emoji_01.png</span>
        </div>
        <div class="placard-meta">
          <div id="placardDims">PNG Raster</div>
          <div>Gallery Wing A</div>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <div class="filmstrip" id="filmstrip" role="tablist" aria-label="Collection Index"></div>
  </footer>

  <!-- Lightbox Inspection View -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork Inspection">
    <div class="lightbox-stage" id="lightboxStage">
      <img id="lightboxImg" src="" alt="" />
    </div>
    <div class="lightbox-bar">
      <span id="lightboxLabel">emoji_01.png</span>
      <button class="btn-ghost" id="pixelToggle">Pixel Grid: Off</button>
      <button class="btn-ghost" id="closeLightbox">Close [Esc]</button>
    </div>
  </div>

  <script>
    const TOTAL = 32;
    const items = Array.from({ length: TOTAL }, (_, i) => {
      const id = String(i + 1).padStart(2, "0");
      return {
        index: i,
        id,
        title: `Specimen ${id}`,
        filename: `emoji_${id}.png`,
        src: `assets/emoji_${id}.png`,
        dims: "PNG Raster"
      };
    });

    let activeIndex = 0;
    const stageCards = document.getElementById("stageCards");
    const filmstrip = document.getElementById("filmstrip");
    const counterDisplay = document.getElementById("counterDisplay");
    const placardCat = document.getElementById("placardCat");
    const placardTitle = document.getElementById("placardTitle");
    const placardFile = document.getElementById("placardFile");
    const placardDims = document.getElementById("placardDims");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxLabel = document.getElementById("lightboxLabel");
    const lightboxStage = document.getElementById("lightboxStage");

    const cardElements = [];
    const thumbElements = [];

    items.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = "exhibit-card";
      card.dataset.pos = "hidden";

      const mat = document.createElement("div");
      mat.className = "exhibit-mat";

      const img = document.createElement("img");
      img.src = item.src;
      img.alt = item.title;
      img.loading = idx < 4 ? "eager" : "lazy";

      img.onload = () => {
        item.dims = `${img.naturalWidth} × ${img.naturalHeight} px`;
        if (activeIndex === idx) placardDims.textContent = item.dims;
      };

      img.onerror = () => {
        img.remove();
        const fallback = document.createElement("div");
        fallback.className = "missing-placeholder";
        fallback.innerHTML = `<strong>${item.id}</strong><span>${item.filename}</span>`;
        mat.appendChild(fallback);
      };

      mat.appendChild(img);
      card.appendChild(mat);
      stageCards.appendChild(card);
      cardElements.push(card);

      card.addEventListener("click", () => {
        if (activeIndex === idx) {
          openLightbox(item);
        } else {
          goTo(idx);
        }
      });

      const thumb = document.createElement("button");
      thumb.className = "thumb-btn";
      thumb.title = `${item.id} — ${item.filename}`;
      thumb.setAttribute("aria-label", `View ${item.title}`);

      const tImg = document.createElement("img");
      tImg.src = item.src;
      tImg.alt = "";
      tImg.loading = "lazy";
      tImg.onerror = () => {
        tImg.remove();
        thumb.innerHTML = `<span>${item.id}</span>`;
      };

      thumb.appendChild(tImg);
      thumb.addEventListener("click", () => goTo(idx));
      filmstrip.appendChild(thumb);
      thumbElements.push(thumb);
    });

    function getWrappedDelta(index, current, total) {
      let diff = index - current;
      if (diff > total / 2) diff -= total;
      if (diff < -total / 2) diff += total;
      return diff;
    }

    function render() {
      cardElements.forEach((card, idx) => {
        const delta = getWrappedDelta(idx, activeIndex, TOTAL);
        if (delta === 0) card.dataset.pos = "center";
        else if (delta === -1) card.dataset.pos = "prev";
        else if (delta === 1) card.dataset.pos = "next";
        else if (delta === -2) card.dataset.pos = "far-prev";
        else if (delta === 2) card.dataset.pos = "far-next";
        else card.dataset.pos = "hidden";
      });

      thumbElements.forEach((thumb, idx) => {
        thumb.classList.toggle("active", idx === activeIndex);
      });

      const activeThumb = thumbElements[activeIndex];
      if (activeThumb) {
        activeThumb.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }

      const current = items[activeIndex];
      counterDisplay.textContent = `${current.id} / ${String(TOTAL).padStart(2, "0")}`;
      placardCat.textContent = `CATALOG NO. ${current.id}`;
      placardTitle.textContent = current.title;
      placardFile.textContent = current.src;
      placardDims.textContent = current.dims;
    }

    function goTo(index) {
      activeIndex = (index + TOTAL) % TOTAL;
      render();
    }

    document.getElementById("prevBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      goTo(activeIndex - 1);
    });

    document.getElementById("nextBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      goTo(activeIndex + 1);
    });

    const themeToggle = document.getElementById("themeToggle");
    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.getAttribute("data-theme") === "dark";
      root.setAttribute("data-theme", isDark ? "light" : "dark");
      themeToggle.textContent = isDark ? "Nocturne" : "Daylight";
    }
    themeToggle.addEventListener("click", toggleTheme);

    function openLightbox(item) {
      lightboxImg.src = item.src;
      lightboxImg.alt = item.title;
      lightboxLabel.textContent = `${item.filename} (${item.dims})`;
      lightbox.classList.add("open");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
    }

    document.getElementById("closeLightbox").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    const pixelToggle = document.getElementById("pixelToggle");
    pixelToggle.addEventListener("click", () => {
      const active = lightboxStage.classList.toggle("pixelated");
      pixelToggle.textContent = `Pixel Grid: ${active ? "On" : "Off"}`;
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") return closeLightbox();
      if (lightbox.classList.contains("open")) return;
      if (e.key === "ArrowRight") goTo(activeIndex + 1);
      if (e.key === "ArrowLeft") goTo(activeIndex - 1);
      if (e.key.toLowerCase() === "t") toggleTheme();
      if (e.key.toLowerCase() === "f") openLightbox(items[activeIndex]);
    });

    const viewport = document.getElementById("viewport");
    let startX = null;

    viewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".nav-arrow")) return;
      startX = e.clientX;
    });

    viewport.addEventListener("pointerup", (e) => {
      if (startX === null) return;
      const diff = e.clientX - startX;
      if (Math.abs(diff) > 45) {
        goTo(diff < 0 ? activeIndex + 1 : activeIndex - 1);
      }
      startX = null;
    });

    let wheelLock = false;
    viewport.addEventListener("wheel", (e) => {
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) < 18 || wheelLock) return;
      e.preventDefault();
      wheelLock = true;
      goTo(delta > 0 ? activeIndex + 1 : activeIndex - 1);
      setTimeout(() => { wheelLock = false; }, 260);
    }, { passive: false });

    render();
  </script>
</body>
</html>
